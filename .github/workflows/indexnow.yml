name: Notify IndexNow
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Pages to publish the verification key
        shell: bash
        run: |
          KEY_URL="https://nyandwi-land.pages.dev/nyandwi-seo-key-3b8e1f6a9d4c2b705e8a1f3d6c9b4e27.txt"
          for attempt in $(seq 1 12); do
            status=$(curl -sS -o /dev/null -w "%{http_code}" "$KEY_URL" || true)
            if [ "$status" = "200" ]; then
              echo "IndexNow key is publicly available."
              exit 0
            fi
            echo "Waiting for deployment (HTTP $status), attempt $attempt/12..."
            sleep 15
          done
          echo "Cloudflare did not publish the IndexNow key in time."
          exit 1
      - name: Notify participating search engines
        env:
          INDEXNOW_KEY: "66c6e779f5a1f6176b7ef26183c0dfe1"
        shell: bash
        run: |
          curl -sS --fail-with-body -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "{\"host\":\"nyandwi-land.pages.dev\",\"key\":\"$INDEXNOW_KEY\",\"keyLocation\":\"https://nyandwi-land.pages.dev/nyandwi-seo-key-3b8e1f6a9d4c2b705e8a1f3d6c9b4e27.txt\",\"urlList\":[\"https://nyandwi-land.pages.dev/\"]}"
